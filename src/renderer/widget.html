<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Token消费器</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="widget">
    <div class="head">
      <span class="dot"></span>
      <span class="platform" id="platform">DeepSeek</span>
      <span class="spacer"></span>
      <span class="port" id="port">--</span>
      <button id="btn-open" data-i18n-title="widgetOpen">⤢</button>
      <button id="btn-close" data-i18n-title="widgetHide">×</button>
    </div>
    <div class="body">
      <div class="balance">
        <div class="label" data-i18n="widgetBalance">剩余金额</div>
        <div class="value" id="balance">--</div>
      </div>
      <div class="today">
        <div class="label" data-i18n="widgetToday">今日消耗</div>
        <div class="value" id="today-cost">--</div>
        <div class="sub" id="today-tokens"></div>
      </div>
    </div>
    <div class="foot">
      <svg id="spark" width="130" height="26" preserveAspectRatio="none"></svg>
      <span class="hint" id="est">--</span>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="i18n.js"></script>
  <script src="widget.js"></script>
</body>
</html>
